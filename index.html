<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101038">
<title>Kart 64 — fan recreation</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;height:100%;background:#0a0a24;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;font-family:"Arial Black",Arial,sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:auto}
.hidden{display:none!important}
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;box-sizing:border-box;text-align:center;color:#fff;background:radial-gradient(circle at 50% 25%,#2a4fd0 0,#16205e 55%,#0a0a24 100%);overflow-y:auto}
.screen.checker{background:linear-gradient(#101038e8,#101038e8),repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/42px 42px}
h1.logo{font-style:italic;font-size:clamp(38px,9vw,84px);margin:0;line-height:.95;color:#ffd84a;text-shadow:4px 4px 0 #e52521,8px 8px 0 #202060;letter-spacing:1px}
h2{font-style:italic;font-size:clamp(22px,5vw,40px);margin:0;color:#ffd84a;text-shadow:3px 3px 0 #900}
.sub{font:700 clamp(12px,2.6vw,16px) Arial;color:#dfe8ff;max-width:640px}
.btn{font:italic 900 clamp(16px,3.6vw,24px) "Arial Black",Arial;color:#fff;background:#e52521;border:3px solid #fff;border-radius:14px;padding:12px 26px;box-shadow:0 5px 0 #700;cursor:pointer;min-width:min(78vw,340px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #700}
.btn.alt{background:#2a4fd0;box-shadow:0 5px 0 #122058}.btn.green{background:#2fae3f;box-shadow:0 5px 0 #14551f}
.btn.small{min-width:0;font-size:15px;padding:9px 16px}
.btn.sel{outline:5px solid #ffd84a}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,132px));gap:10px;justify-content:center;max-width:760px}
.tile{background:#1c2a6e;border:3px solid #ffffff66;border-radius:12px;padding:10px 6px;cursor:pointer;color:#fff}
.tile.sel{border-color:#ffd84a;background:#31459e}
.tile .face{font-size:34px;line-height:1}.tile .nm{font:italic 900 14px "Arial Black"}.tile .ds{font:700 11px Arial;color:#cfe0ff}
table{border-collapse:collapse;font:700 15px Arial;background:#10183fee;border:3px solid #fff;border-radius:10px;overflow:hidden}
td,th{padding:7px 14px;color:#fff;text-align:left}th{color:#ffd84a}tr.me{background:#5a1a1a}
input.code{font:900 26px monospace;letter-spacing:6px;text-transform:uppercase;width:6.5em;text-align:center;border-radius:10px;border:3px solid #fff;padding:8px;background:#111;color:#ffd84a}
.bigcode{font:900 44px monospace;letter-spacing:8px;color:#ffd84a;text-shadow:3px 3px 0 #900}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;color:#fff}
#pos{position:absolute;right:3vw;bottom:4vh;font:italic 900 clamp(44px,9vw,84px) "Arial Black";color:#ffd84a;text-shadow:4px 4px 0 #e52521,7px 7px 0 #00000088}
#lap{position:absolute;right:2vw;top:11vh;text-align:right;font:italic 900 clamp(18px,4vw,30px) "Arial Black";text-shadow:2px 2px 0 #000}
#timer{position:absolute;right:2vw;top:2.5vh;text-align:right;font:700 clamp(13px,2.8vw,19px) "Courier New",monospace;text-shadow:2px 2px 0 #000;white-space:pre}
#itemslot{position:absolute;left:2vw;top:2.5vh;width:62px;height:62px;border:4px solid #fff;border-radius:10px;background:#202060cc;display:flex;align-items:center;justify-content:center;font-size:34px}
#msg{position:absolute;left:50%;top:26%;transform:translateX(-50%);font:italic 900 clamp(28px,7vw,60px) "Arial Black";color:#ffd84a;text-shadow:4px 4px 0 #e52521;text-align:center;white-space:nowrap}
#lights{position:absolute;left:50%;top:12%;transform:translateX(-50%);display:flex;gap:10px}
.light{width:34px;height:34px;border-radius:50%;background:#401010;border:3px solid #fff}.light.on{background:#ff352e}.light.go{background:#35e35a}
#minimap{position:absolute;left:2vw;bottom:3vh;width:112px;height:112px;background:#00000066;border:2px solid #ffffff88;border-radius:8px}
#balloons{position:absolute;left:50%;bottom:3vh;transform:translateX(-50%);font-size:30px}
#pauseBtn{position:absolute;left:50%;top:1.2vh;transform:translateX(-50%);pointer-events:auto;padding:3px 10px;font-size:11px;opacity:.55;border-width:2px;box-shadow:none;min-width:0}
#itemslot .itm{font-size:32px;line-height:1}
#itemslot .cnt{position:absolute;right:3px;bottom:1px;font:italic 900 19px 'Arial Black';color:#ffd84a;text-shadow:2px 2px 0 #000}
#itemslot{overflow:visible}
@media (pointer:coarse){#pos{bottom:27vh;right:39vw;font-size:clamp(32px,6.5vw,48px)}#minimap{width:82px;height:82px;bottom:2vh}#itemslot{width:52px;height:52px}#itemslot .itm{font-size:26px}#lap{top:10vh}}
#touch{position:fixed;inset:0;z-index:15;pointer-events:none}
#touch .zone{position:absolute;left:0;top:18%;width:46%;height:82%;pointer-events:auto}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font:italic 900 20px "Arial Black";color:#fff;text-shadow:0 2px 2px #000;border:3px solid #ffffff99;opacity:.62}
.tbtn.on{opacity:.97;transform:scale(.93)}
#rotate{position:fixed;inset:0;z-index:40;background:#0a0a24;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;font:700 20px Arial;text-align:center}
@media (orientation:portrait){#rotate.need{display:flex}}
#toast{position:fixed;z-index:50;left:50%;top:10px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:8px;font:700 14px Arial;display:none;max-width:92vw;text-align:center}
.kbd{font:700 12px Arial;color:#cfe0ff}
</style>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="hidden">
  <canvas id="minimap" width="236" height="236"></canvas>
  <div id="itemslot">?</div><div id="lap">LAP 1/3</div><div id="pos">8th</div>
  <div id="timer">TIME 0'00"00</div><div id="msg"></div><div id="lights"></div><div id="balloons"></div>
  <button id="pauseBtn" class="btn small alt">❚❚</button>
</div>
<div id="ui"></div><div id="touch"></div>
<div id="rotate" class="need"><div style="font-size:64px">⟳</div><div>Rotate your phone to landscape</div></div>
<div id="toast"></div>
<script type="module" src="./src/game.js"></script>
</body>
</html>
